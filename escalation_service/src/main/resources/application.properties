spring.application.name=escalation-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/escalation_db
spring.datasource.username=postgres
spring.datasource.password=Vrund@111
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=escalation-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Scheduler
# Run every 1 minute
escalation.scheduler.rate=60000

# Complaint Service URL
complaint.service.url=http://localhost:8080/complaints
